# 放在实际站点 server {} 内。文件路径对应 service.example.yaml 的显式目标。
# 首次无 latest 时应返回已配置的 initial_health_checks 状态。
root /data/nginx-publish/frontend_static/ybf-uat-web/latest;

location = /index.html {
    add_header Cache-Control "no-store" always;
    open_file_cache off;
    try_files $uri =404;
}
location = /.release-version {
    add_header Cache-Control "no-store" always;
    open_file_cache off;
    try_files $uri =404;
}
# 跨版本共享目录：旧 index 懒加载的资源仍可访问，不能指向 latest/assets。
location ^~ /assets/ {
    alias /data/nginx-publish/frontend_static/ybf-uat-web/assets/;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    autoindex off;
}
location / {
    add_header Cache-Control "no-store" always;
    open_file_cache off;
    try_files $uri $uri/ /index.html;
}
# asset_retention 至少覆盖客户端最长存活/懒加载时间和缓存窗口。
# 不应允许应用无限期持有旧 HTML；这里的示例兼容窗口为 7 天。
