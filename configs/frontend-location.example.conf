# 独立主机 Nginx。该 server 应由主配置 include；按实际域名/端口修改。
server {
    listen 8080;
    server_name app.example.com;
    root /var/www/app/latest;
    index index.html;

    # 避免软链切换后继续复用旧文件描述符。
    open_file_cache off;
    location = /.release-version {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    # 普通 dist 模式：资源从 latest 读取，缺失资源不能返回 SPA HTML。
    location /assets/ {
        try_files $uri =404;
    }
}

# 可选 shared_assets: true：用以下 location 替换上面的 /assets/。
# 制品需满足 frontend-manifest.json + 哈希资源约束，服务保留旧资源供旧页面加载。
