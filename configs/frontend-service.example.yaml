# 仅前端的 HTTP 服务配置。UTF-8；复用本机已经运行的 Nginx。
listen_addr: ":9166"
env: uat
data_dir: /data/nginx-updata-config/data
log_file: /data/wwwlogs/nginx-updata-config-http.log
release_auth_tokens:
  uat: replace-with-uat-release-token

oras:
  binary: /usr/local/bin/oras
  # 用只有 pull 权限的 Robot 预先登录，生成认证文件。
  registry_config: /etc/nginx-release/harbor-auth.json
  # Harbor 地址/项目/仓库；不加 https://、tag 或 digest。
  # app 请求得到 harbor.example.com/web/app-dist。
  repository: harbor.example.com/web/{server_name}-dist
  # ca_file: /etc/nginx-release/harbor-ca.pem

targets:
  - frontend_static

# POST params: {server_name: app, path_dest: /var/www}
# 前端落盘 /var/www/app/<完整 SHA>，latest 与 SHA 目录同级。
# Nginx 已有 root 应指向 /var/www/app/latest。
# 不用 Docker，不配置 CI 代理，不需要 nginx 路径块或逐站点 targets。
