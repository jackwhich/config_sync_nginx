# 可作为 Prometheus 配置使用；文件名保留以兼容原有引用。
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - prometheus-recording.example.yml
  - prometheus-alerts.example.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']  # 替换为已有 Alertmanager 地址
scrape_configs:
  - job_name: nginx-http-release
    scrape_interval: 30s
    static_configs:
      - targets: ['127.0.0.1:8081']
    # /metrics 受服务 allowed_client_ips 限制；将监控来源加入白名单。
