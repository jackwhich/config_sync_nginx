# UTF-8。HTTP 发布服务；已有 Nginx 自动识别，不需要填写 nginx 配置块。
listen_addr: ":9166"
# hostname 可省略，默认读取本机主机名；也兼容 node_id。
# hostname: nginx-uat-01
# env 可省略，按 release_auth_tokens 中的环境认证；填写后只接受指定环境。
env: uat
data_dir: /data/nginx-updata-config/data
log_file: /data/wwwlogs/nginx-updata-config-http.log

release_auth_tokens:
  uat: replace-with-uat-release-token

repos:
  config:
    url: https://gitlab.example.com/ops/nginx-vhosts.git
    gitlab_token: replace-with-config-read-token
    # allowed_branches: [uat]  # 可选；不配置则允许仓库任意分支上的提交。
  whitelist:
    url: https://gitlab.example.com/ops/nginx-whitelist.git
    gitlab_token: replace-with-whitelist-read-token

# 本节点接受哪些类型的发布请求（仅区分 type）。
# path_dest（绝对路径）和 server_name（站点目录键）在 POST JSON 的 params 中传入。
# project 是可选顶层字段，不参与目录身份。
targets:
  - config
  - whitelist
  # - frontend_static

# 启用 frontend_static 时配置 ORAS 和 Harbor pull 仓库。
# {server_name} 替换为请求中的站点目录键；单应用也可填写完整固定仓库名。
# oras:
#   binary: /usr/local/bin/oras
#   registry_config: /etc/nginx-release/harbor-auth.json
#   repository: harbor.example.com/web/{server_name}-dist
#   # ca_file: /etc/nginx-release/harbor-ca.pem

# 可选限制实际调用方 IP；留空时由环境 Token 认证。
# allowed_client_ips: ["192.0.2.10"]
# 单实例无需 nginx 块；多实例时仅指定已有实例的 pid_file 即可。
# nginx:
#   pid_file: /run/nginx-custom.pid
